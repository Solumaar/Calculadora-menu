<script>

    var x = 0;
    var y = 0;
    var resultado = 0;
    var opcao = 0;

    alert("`seja bem vindo a nossa calculadora meia boca´")

    x = Number(prompt("informe um numero: "));
    y = Number(prompt("informe outro numero: "))

    while (true) {

        opcao = Number(prompt("informe uma opção:" +
            "\n 0- Sair " +
            "\n 1 - Receber Numeros" +
            "\n 2 - Soma " +
            "\n 3 - Multiplicar" +
            "\n 9 - Msg Boas vindas"))

        if (opcao == 0) { //sair

            break;

        } else if (opcao == 1) { // recebe opção 1


        } else if (opcao == 2) { //Receber a segunda opção da lista
            resultado = x + y;

            alert(" `a soma de ${x} e ${y} é o ${resultado}`");

        } else if (opcao == 3) {

            resultado = x * y;
            alert("` a multiplicação de ${x} e ${y} é o ${resultado} ´")

        } else if (opcao = 9) {

            alert("`seja bem vindo a nossa calculadora meia boca´")

        } else (opcao == null);

        alert("inválido")

    }

</script>
